name: ONESEC v3.0 自动审计

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'GitHub 仓库链接 (公开)'
        required: true
        type: string
      target_url:
        description: '目标网站URL (可选，有则启动Scrapling+Playwright验证)'
        required: false
        default: ''
        type: string

jobs:
  audit:
    name: AI代码审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          pip install requests scrapling playwright
          python -m playwright install chromium --with-deps

      - name: 运行v3审计
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: |
          python onesec_service.py "${{ github.event.inputs.repo_url }}" "$TARGET_URL" 2>&1

      - name: 上传报告
        uses: actions/upload-artifact@v4
        with:
          name: 审计报告
          path: _scan_reports/

      - name: 报告摘要
        run: |
          echo "## ✅ v3.0审计完成" >> $GITHUB_STEP_SUMMARY
          ls _scan_reports/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "报告已生成"
